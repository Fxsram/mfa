{% extends "base.html" %}
{% block content %}
<h2>Authenticate with your registered authenticator</h2>
<p id="status">Starting...</p>
<script src="/static/webauthn.js"></script>
<script>
  (async () => {
    const statusEl = document.getElementById("status");
    statusEl.textContent = "Requesting assertion options...";
    try {
      const res = await fetch("{% url 'accounts:webauthn_auth_begin' %}", {
        credentials: "include"
      });
      const options = await res.json();

      // Convert fields on the options object itself
      options.challenge = base64UrlToBuffer(options.challenge);
      if (Array.isArray(options.allowCredentials)) {
        options.allowCredentials = options.allowCredentials.map(c => ({
          ...c,
          id: base64UrlToBuffer(c.id),
        }));
      }

      const assertion = await navigator.credentials.get({ publicKey: options });

      const authResp = {
        id: assertion.id,
        rawId: bufferToBase64Url(assertion.rawId),
        type: assertion.type,
        response: {
          authenticatorData: bufferToBase64Url(assertion.response.authenticatorData),
          clientDataJSON: bufferToBase64Url(assertion.response.clientDataJSON),
          signature: bufferToBase64Url(assertion.response.signature),
          userHandle: assertion.response.userHandle
            ? bufferToBase64Url(assertion.response.userHandle)
            : null,
        },
      };

      const complete = await fetch("{% url 'accounts:webauthn_auth_complete' %}", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": getCookie("csrftoken"),
        },
        credentials: "include",
        body: JSON.stringify(authResp),
      });
      const result = await complete.json();

      if (complete.ok && result.ok) {
        window.location = "{% url 'accounts:profile' %}";
      } else {
        statusEl.textContent =
          "Authentication failed: " + (result.error || complete.statusText);
      }
    } catch (err) {
      statusEl.textContent = "Error: " + err;
    }
  })();
</script>
{% endblock %}
