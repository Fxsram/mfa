{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
  <h2>Create account</h2>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Register</button>
  </form>
  <p class="muted">Already have an account? <a href="/login/">Log in</a>.</p>
{% endblock %}
