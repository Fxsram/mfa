{% extends "base.html" %}
{% load static %}
{% block content %}
<h2>Register a biometric authenticator</h2>
<p>Click the button and follow your device prompts (TouchID, Windows Hello, Security Key).</p>

<label for="cred-name">This device name (optional)</label>
<input id="cred-name" placeholder="e.g. My phone" />
<button id="register-btn">Register authenticator</button>
<p id="status">Preparing…</p>

<!-- Load helpers; keep inline fallback -->
<script src="{% static 'webauthn.js' %}?v=2"></script>
<script>
(function(){
  if(typeof window.base64UrlToBuffer!=="function"){
    window.base64UrlToBuffer=function(b64url){const pad="=".repeat((4-(b64url.length%4))%4);const b64=(b64url.replace(/-/g,"+").replace(/_/g,"/")+pad);const str=atob(b64);const bytes=new Uint8Array(str.length);for(let i=0;i<str.length;i++)bytes[i]=str.charCodeAt(i);return bytes.buffer;}
  }
  if(typeof window.bufferToBase64Url!=="function"){
    window.bufferToBase64Url=function(buf){const bytes=new Uint8Array(buf);let str="";for(let i=0;i<bytes.byteLength;i++)str+=String.fromCharCode(bytes[i]);return btoa(str).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}
  }
  if(typeof window.getCookie!=="function"){
    window.getCookie=function(name){const m=document.cookie.match(new RegExp("(^|; )"+name+"=([^;]*)"));return m?decodeURIComponent(m[2]):null;}
  }
  if(typeof window.ensureWebAuthn!=="function"){
    window.ensureWebAuthn=function(){if(!("credentials" in navigator)||typeof navigator.credentials.create!=="function"){throw new Error("WebAuthn not available (use HTTPS or http://localhost)");}}
  }
})();
</script>

<script>
document.getElementById("register-btn").addEventListener("click", async () => {
  const name = document.getElementById("cred-name").value || "Authenticator";
  const statusEl = document.getElementById("status");
  try {
    ensureWebAuthn();

    const res = await fetch("{% url 'accounts:webauthn_register_begin' %}", { credentials: "include" });
    if (!res.ok) throw new Error("Failed to start: " + res.status);
    const options = await res.json();

    // webauthn 2.7: challenge and user.id are top-level
    options.challenge = base64UrlToBuffer(options.challenge);
    options.user.id   = base64UrlToBuffer(options.user.id);

    const cred = await navigator.credentials.create({ publicKey: options });

    const attestation = {
      id: cred.id,
      rawId: bufferToBase64Url(cred.rawId),
      type: cred.type,
      response: {
        clientDataJSON: bufferToBase64Url(cred.response.clientDataJSON),
        attestationObject: bufferToBase64Url(cred.response.attestationObject),
      },
      name: name
    };

    const complete = await fetch("{% url 'accounts:webauthn_register_complete' %}", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-CSRFToken": getCookie("csrftoken") },
      credentials: "include",
      body: JSON.stringify(attestation),
    });
    const txt = await complete.text();
    let result; try { result = JSON.parse(txt); } catch { result = { ok: false, error: txt }; }

    if (complete.ok && result.ok) {
      statusEl.textContent = "Registration successful.";
      window.location = "{% url 'accounts:profile' %}";
    } else {
      statusEl.textContent = "Registration failed: " + (result.error || complete.statusText);
    }
  } catch (err) {
    statusEl.textContent = "Error: " + err.message;
  }
});
</script>
{% endblock %}
